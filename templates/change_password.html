<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password | QuizMaster</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-subtle: rgba(79, 70, 229, 0.08);
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --glass-bg: rgba(255, 255, 255, 0.9);
            --glass-border: rgba(226, 232, 240, 0.9);
            --glass-shadow: 0 20px 40px -15px rgba(31, 38, 135, 0.12);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #e0e7ff 0%, #fae8ff 50%, #e0f2fe 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: var(--text-dark);
        }

        .change-card {
            width: 100%;
            max-width: 480px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px;
            box-shadow: var(--glass-shadow);
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .icon-circle {
            width: 68px;
            height: 68px;
            background: linear-gradient(135deg, #e0e7ff 0%, #c7d2fe 100%);
            color: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin: 0 auto 16px auto;
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.2);
        }

        h2 { font-size: 24px; font-weight: 700; color: var(--text-dark); margin-bottom: 6px; }
        .subtitle { font-size: 14px; color: var(--text-muted); line-height: 1.5; }

        .notice-box {
            background: #fffbeb;
            border: 1px solid #fef3c7;
            border-left: 4px solid var(--warning);
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 13px;
            color: #92400e;
            margin-bottom: 24px;
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }

        .notice-box i { margin-top: 2px; font-size: 16px; }

        .alert-error {
            background: #fef2f2;
            border: 1px solid #fee2e2;
            border-left: 4px solid var(--danger);
            color: #b91c1c;
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 13px;
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper input {
            width: 100%;
            padding: 12px 42px 12px 14px;
            background: rgba(255, 255, 255, 0.85);
            border: 1.5px solid #cbd5e1;
            border-radius: 12px;
            font-size: 14px;
            color: var(--text-dark);
            outline: none;
            transition: all 0.2s;
        }

        .input-wrapper input:focus {
            background: #fff;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        .toggle-pw {
            position: absolute;
            right: 14px;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 14px;
            transition: color 0.2s;
        }
        .toggle-pw:hover { color: var(--primary); }

        .policy-checklist {
            background: rgba(241, 245, 249, 0.7);
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 22px;
            border: 1px solid #e2e8f0;
        }

        .policy-item {
            font-size: 12px;
            color: #64748b;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
            transition: color 0.2s;
        }
        .policy-item:last-child { margin-bottom: 0; }
        .policy-item i { font-size: 11px; }

        .policy-item.met {
            color: var(--success);
            font-weight: 600;
        }
        .policy-item.met i::before {
            content: "\f00c"; /* FontAwesome check */
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 6px 16px rgba(79, 70, 229, 0.3);
        }

        .btn-submit:hover:not(:disabled) {
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.4);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .footer-links {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
        }

        .footer-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }
        .footer-links a:hover { color: var(--primary); }
    </style>
</head>
<body>

    <div class="change-card">
        <div class="card-header">
            <div class="icon-circle">
                <i class="fas fa-key"></i>
            </div>
            <h2>Set New Password</h2>
            <p class="subtitle">Please update your temporary password to secure your account before proceeding to the platform.</p>
        </div>

        <div class="notice-box">
            <i class="fas fa-shield-alt"></i>
            <div>
                <strong>Security Policy:</strong> You cannot access your dashboard or exams until you set your permanent password.
            </div>
        </div>

        <div id="errorAlert" class="alert-error" style="display: none;">
            <i class="fas fa-exclamation-circle"></i>
            <span id="errorMessage"></span>
        </div>

        <form id="passwordForm" onsubmit="handlePasswordChange(event)">
            <div class="form-group">
                <label for="current_password">Current (Temporary) Password</label>
                <div class="input-wrapper">
                    <input type="password" id="current_password" name="current_password" required placeholder="Enter temporary password">
                    <i class="fas fa-eye toggle-pw" onclick="togglePassword('current_password', this)"></i>
                </div>
            </div>

            <div class="form-group">
                <label for="new_password">New Password</label>
                <div class="input-wrapper">
                    <input type="password" id="new_password" name="new_password" required placeholder="Enter new password" oninput="validatePasswordPolicy()">
                    <i class="fas fa-eye toggle-pw" onclick="togglePassword('new_password', this)"></i>
                </div>
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm New Password</label>
                <div class="input-wrapper">
                    <input type="password" id="confirm_password" name="confirm_password" required placeholder="Re-enter new password" oninput="validatePasswordPolicy()">
                    <i class="fas fa-eye toggle-pw" onclick="togglePassword('confirm_password', this)"></i>
                </div>
            </div>

            <div class="policy-checklist">
                <div class="policy-item" id="rule-length">
                    <i class="fas fa-circle"></i> Minimum 6 characters
                </div>
                <div class="policy-item" id="rule-match">
                    <i class="fas fa-circle"></i> Passwords match
                </div>
                <div class="policy-item" id="rule-diff">
                    <i class="fas fa-circle"></i> Different from current password
                </div>
            </div>

            <button type="submit" id="submitBtn" class="btn-submit">
                <span id="btnText">Update Password & Continue</span>
                <i class="fas fa-arrow-right"></i>
            </button>
        </form>

        <div class="footer-links">
            <a href="/logout"><i class="fas fa-sign-out-alt"></i> Cancel & Sign Out</a>
        </div>
    </div>

    <script>
        function togglePassword(inputId, icon) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        function validatePasswordPolicy() {
            const currentPw = document.getElementById('current_password').value;
            const newPw = document.getElementById('new_password').value;
            const confirmPw = document.getElementById('confirm_password').value;

            // 1. Length
            const lengthMet = newPw.length >= 6;
            document.getElementById('rule-length').classList.toggle('met', lengthMet);

            // 2. Match
            const matchMet = newPw.length > 0 && newPw === confirmPw;
            document.getElementById('rule-match').classList.toggle('met', matchMet);

            // 3. Different
            const diffMet = newPw.length > 0 && currentPw.length > 0 && newPw !== currentPw;
            document.getElementById('rule-diff').classList.toggle('met', diffMet);

            return lengthMet && matchMet && diffMet;
        }

        async function handlePasswordChange(e) {
            e.preventDefault();

            const currentPw = document.getElementById('current_password').value.trim();
            const newPw = document.getElementById('new_password').value.trim();
            const confirmPw = document.getElementById('confirm_password').value.trim();
            const errorAlert = document.getElementById('errorAlert');
            const errorMsg = document.getElementById('errorMessage');
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');

            errorAlert.style.display = 'none';

            if (!currentPw || !newPw || !confirmPw) {
                showError('All password fields are required.');
                return;
            }

            if (newPw.length < 6) {
                showError('New password must be at least 6 characters long.');
                return;
            }

            if (newPw !== confirmPw) {
                showError('New password and confirmation do not match.');
                return;
            }

            if (newPw === currentPw) {
                showError('New password cannot be the same as your temporary password.');
                return;
            }

            // Disable button during processing
            submitBtn.disabled = true;
            btnText.textContent = 'Updating Password...';

            try {
                const response = await fetch('/api/auth/change-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        current_password: currentPw,
                        new_password: newPw,
                        confirm_password: confirmPw
                    })
                });

                const data = await response.json();

                if (data.success) {
                    Swal.fire({
                        icon: 'success',
                        title: 'Password Updated!',
                        text: 'Your password has been changed successfully. Redirecting to your dashboard...',
                        timer: 2000,
                        showConfirmButton: false
                    }).then(() => {
                        window.location.href = data.redirect || '/';
                    });
                } else {
                    showError(data.message || 'Failed to update password.');
                    submitBtn.disabled = false;
                    btnText.textContent = 'Update Password & Continue';
                }
            } catch (err) {
                showError('A network error occurred. Please try again.');
                submitBtn.disabled = false;
                btnText.textContent = 'Update Password & Continue';
            }
        }

        function showError(msg) {
            const errorAlert = document.getElementById('errorAlert');
            const errorMsg = document.getElementById('errorMessage');
            errorMsg.textContent = msg;
            errorAlert.style.display = 'flex';
        }
    </script>
</body>
</html>
