<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Student | QuizMaster</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow-sm" style="max-width: 600px; margin: 0 auto;">
            <div class="card-header bg-white">
                <h4 class="mb-0">Edit Student Profile</h4>
            </div>
            <div class="card-body">
                <form action="/admin/update_student" method="POST">
                    <input type="hidden" name="user_id" value="{{ user.user_id }}">
                    
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control" name="full_name" value="{{ user.full_name }}" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" name="email" value="{{ user.email }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Mobile</label>
                        <input type="text" class="form-control" name="mobile" value="{{ user.mobile }}">
                    </div>

                    <div class="row mb-3">
                        <div class="col">
                            <label class="form-label">Department</label>
                            <input type="text" class="form-control" name="department" value="{{ user.department }}">
                        </div>
                        <div class="col">
                            <label class="form-label">Year/Sem</label>
                            <input type="text" class="form-control" name="study_year" value="{{ user.study_year }}">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Roll Number</label>
                        <input type="text" class="form-control" name="roll_number" value="{{ user.roll_number }}">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Enrolled Batch</label>
                        <select class="form-select" name="enrolled_session">
                            <option value="">-- None --</option>
                            {% for s in sessions %}
                                <option value="{{ s.batch }}" {% if user.enrolled_session == s.batch %}selected{% endif %}>{{ s.batch }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold text-primary">Exam Center Allocation</label>
                        <select class="form-select" name="allotted_center_id">
                            <option value="">-- Not Allocated --</option>
                            {% for c in centers %}
                                <option value="{{ c.center_id }}" {% if user.allotted_center_id == c.center_id %}selected{% endif %}>
                                    {{ c.center_name }} (Filled: {{ c.allocated_count }}/{{ c.capacity }})
                                </option>
                            {% endfor %}
                        </select>
                        <div class="form-text">Admins can manually override system allocation here.</div>
                    </div>

                    <div class="row mb-3">
                        <div class="col">
                            <label class="form-label">Days Present</label>
                            <input type="number" class="form-control" name="attendance_present" value="{{ user.attendance_present or 0 }}">
                        </div>
                        <div class="col">
                            <label class="form-label">Total Days</label>
                            <input type="number" class="form-control" name="attendance_total" value="{{ user.attendance_total or 0 }}">
                        </div>
                    </div>

                    <div class="d-flex justify-content-between mt-4">
                        <a href="/manage_students" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">Update Student</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
